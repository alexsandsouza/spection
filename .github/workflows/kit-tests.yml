name: SPECTION Kit Tests

on:
  push:
    paths:
      - "kit/**"
      - ".github/workflows/kit-tests.yml"
  pull_request:
    paths:
      - "kit/**"
      - ".github/workflows/kit-tests.yml"

permissions:
  contents: read

jobs:
  test-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s kit/tests -v
      - name: CLI help
        run: python kit/spection.py --help
