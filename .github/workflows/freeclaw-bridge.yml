name: FreeClaw Bridge Tests
on:
  push:
    paths:
      - "integrations/freeclaw/**"
      - "tests/test_freeclaw_bridge.py"
      - ".github/workflows/freeclaw-bridge.yml"
  pull_request:
    paths:
      - "integrations/freeclaw/**"
      - "tests/test_freeclaw_bridge.py"
      - ".github/workflows/freeclaw-bridge.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p 'test_freeclaw_bridge.py' -v
