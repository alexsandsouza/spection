name: SPECTION Portal
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/portal-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: spection-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: site
        run: npm install
      - name: Build
        working-directory: site
        env:
          NEXT_PUBLIC_BASE_PATH: /spection
        run: npm run build
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
